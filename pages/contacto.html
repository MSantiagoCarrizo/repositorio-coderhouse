<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don Fogón | Contacto</title>
    <meta name="description"
        content="Contacta con Don Fogón para reservas, consultas o eventos. Encuentra nuestra dirección, teléfono, horario y redes sociales. ¡Estamos aquí para atenderte!">
    <meta name="keywords"
        content="don fogon, restaurante tradicional, promociones para grupos, menu para grupos, comida casera, ofertas para eventos, reservaciones para grupo, reuniones y celebraciones, economico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body class="fondo-inicio">
    <div class="layout">
        <header>
            <nav class="navbar navbar-expand-md navbar-dark ">
                <div class="container-fluid">
                    <a class="navbar-brand " href="../index.html">
                        <img src="../assets/icons/logo.png" alt="Logo" class="d-inline-block align-text-top img-nav">
                        Restaurante Don Fogón
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarNavDropdown">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="../index.html">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="./restaurante.html">Restaurante</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="./nosotros.html">Nosotros</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="./carta.html">Carta</a>
                            </li>
                            <li class="nav-item ">
                                <a class="nav-link active" href="./contacto.html">Contacto</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <div class="recuadro-especial animate__animated animate__fadeIn">
                <h3 class="fondo-marron">Reservar Mesa</h3>
                <form>

                    <div class="flex-form">
                        <div class="form-grupo">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" required>
                        </div>
                        <div class="form-grupo">
                            <label for="apellido">Apellido:</label>
                            <input type="text" id="apellido" name="apellido" required>
                        </div>
                        <div class="form-grupo">
                            <label for="mail">Email:</label>
                            <input type="email" id="mail" name="mail" required>
                        </div>
                        <div class="form-grupo">
                            <label for="telefono">Teléfono (opcional):</label>
                            <input type="tel" id="telefono" name="telefono">
                        </div>
                        <div class="form-grupo">
                            <label for="asunto">Asunto:</label>
                            <select id="asunto" name="asunto" required>
                                <option value="reserva">Reserva</option>
                                <option value="consulta_menu">Consulta sobre el menú</option>
                                <option value="queja">Queja o sugerencia</option>
                                <option value="otros">Otros</option>
                            </select>
                        </div>
                        <div class="form-grupo">
                            <label for="mensaje">Mensaje:</label>
                            <textarea id="mensaje" name="mensaje"></textarea>
                        </div>
                        <div class="form-grupo">
                            <label for="fecha">Fecha de la reserva:</label>
                            <input type="date" id="fecha" name="fecha">
                        </div>
                        <div class="form-grupo">
                            <label for="hora">Hora de la reserva:</label>
                            <input type="time" id="hora" name="hora">
                        </div>
                        

                        <div class="checkbox">
                            <label for="acepto">Acepto la política de privacidad</label>
                            <input class="form-check-input" type="checkbox" id="acepto" name="acepto" required>
                        </div>

                        <button class="btn btn-light" type="submit" value="Enviar">Enviar</button>

                    </div>

                </form>
            </div>
        </main>

        <footer>
            <p>&copy; Restaurante Don Fogón 2025 · Política de privacidad</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

</body>

</html>
